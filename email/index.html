<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Get in touch</title>
    <link rel="icon" href="../Bilder/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/emailjs-com@2.6.4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function () {
            if (typeof emailjs !== "undefined") emailjs.init("kgjjp-3W7ZGB6WRRM");
        })();
    </script>
    <script src="email.js" defer></script>
</head>
<body>
    <main class="container">
        <a class="back-link" href="../index.html">
            <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
            Petar Petrov
        </a>

        <form id="contact-form" class="contact-form">
            <span class="material-symbols-outlined form-icon" aria-hidden="true">mail</span>
            <h1>Contact with Petar</h1>

            <div class="field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your Name" autocomplete="name" required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" placeholder="Phone" autocomplete="tel" required>
            </div>

            <div class="field">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="How can I help you?" required></textarea>
            </div>

            <button type="submit">Send</button>
        </form>
    </main>
</body>
</html>
